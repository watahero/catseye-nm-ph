<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CatsEyeXI NM Placeholder Finder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>CatsEyeXI &mdash; NM Placeholder Finder</h1>
    <span id="dataInfo" class="data-info"></span>
  </header>

  <main>
    <section class="pick-panel">
      <div class="field-row">
        <label for="zoneInput">Zone</label>
        <select id="zoneInput">
          <option value="">Select a zone&hellip;</option>
        </select>
        <button id="reloadBtn" class="secondary">Reload data</button>
      </div>

      <div class="field-row">
        <label for="nmSelect">NM</label>
        <select id="nmSelect" disabled></select>
      </div>

      <div class="field-row">
        <label for="searchInput">Search all zones</label>
        <input id="searchInput" placeholder="e.g. Tom Tit Tat" />
        <button id="searchBtn">Search</button>
      </div>
    </section>

    <section class="details-panel">
      <h2 id="header">Pick a zone to begin.<span id="categoryBadge" class="badge"></span></h2>
      <p id="sub" class="sub"></p>

      <div class="table-wrap">
        <table id="nmTable">
          <thead>
            <tr>
              <th>Role</th>
              <th>Name</th>
              <th>ID</th>
              <th>Hex</th>
              <th>X</th>
              <th>Y</th>
              <th>Z</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <h3 class="drops-heading">Drops</h3>
      <div class="table-wrap">
        <table id="dropsTable">
          <thead>
            <tr>
              <th>Item</th>
              <th>Type</th>
              <th>Rate</th>
            </tr>
          </thead>
          <tbody id="dropsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="calc-panel" id="calcPanel">
      <h3>Disfavour calculator (spawn chance after N PH rounds)</h3>
      <div class="field-row">
        <label for="roundsInput">PH rounds killed</label>
        <input id="roundsInput" type="number" min="0" max="200" value="0" />
        <span id="calcLbl">-</span>
        <button id="copyBtn" class="secondary">Copy details</button>
      </div>
    </section>
  </main>

  <footer>
    <span id="status">Starting...</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
